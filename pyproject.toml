[project]
name = "daw2score"
version = "0.1.0"
description = "Turn DAW projects (REAPER, DAWproject, stems + MIDI) into Guitar Pro or MusicXML scores"
requires-python = ">=3.11,<3.12"
dependencies = [
    "basic-pitch[onnx]",
    "onnxruntime",
    "pyguitarpro",
    "soundfile",
    "soxr",
    "numpy<2",          # basic-pitch / resampy break on numpy 2
    "setuptools<81",    # resampy still imports pkg_resources
    "lxml>=6.1.3",
]

[project.optional-dependencies]
gui = ["PySide6-Essentials>=6.7"]   # gp_export/gui.py: uv sync --extra gui

[tool.uv]
package = false
# basic-pitch pulls TensorFlow on Windows; TF 2.14 crashes with this numpy and is not needed
# (the ONNX model is used instead), so keep it out of the environment.
override-dependencies = [
    "tensorflow ; sys_platform == 'never'",
    "tensorflow-intel ; sys_platform == 'never'",
]
