# Builds the installers (packaging/build.py) on Windows and macOS, runs the self-test on each built app,
# and on a vX.Y.Z tag attaches them to a DRAFT GitHub release (publish it by hand after checking).
name: build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-15
            name: macos-arm64
          - os: macos-15-intel
            name: macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: astral-sh/setup-uv@v6
      - name: Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Python environment
        run: uv sync --locked --extra gui
      - name: Build
        run: uv run python packaging/build.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daw2score-${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.dmg
            build/selftest.txt
          if-no-files-found: warn

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          v="${TAG#v}"
          # release notes = the CHANGELOG.md section of this version
          awk -v v="$v" '$0 ~ "^## "v" " {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          gh release create "$TAG" --draft --title "daw2score $v" --notes-file notes.md \
            artifacts/*/dist/*.exe artifacts/*/dist/*.dmg
